spring:
  datasource:
    url: jdbc:mysql://localhost:3306/batch_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: batch_user
    password: batch1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  batch:
    jdbc:
      initialize-schema: always  # 메타테이블 자동 생성
    job:
      enabled: true   # JobLauncherApplicationRunner 활성화
      name: orderLoadJob  # 실행할 Job 이름

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
